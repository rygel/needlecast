name: "Release: Manual"

# Manually create a GitHub release. Bumps pom.xml, commits, tags, and creates
# a GitHub Release — then triggers release.yml for native builds + appcast.xml.
# NOTE: Uses workflow_dispatch to trigger release.yml because GITHUB_TOKEN-created
# releases do not fire the `release` event (GitHub prevents infinite loops).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.9.0-beta.1)"
        required: true
        type: string

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Validate version input
        run: |
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "Error: version input is empty"
            exit 1
          fi
          echo "Releasing version: $VERSION"

      - name: Bump pom.xml version
        run: |
          VERSION="${{ inputs.version }}"
          CURRENT=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "Current pom.xml version: $CURRENT"
          sed -i "0,/<version>$CURRENT<\/version>/s//<version>$VERSION<\/version>/" pom.xml
          NEW=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "New pom.xml version: $NEW"
          if [[ "$NEW" != "$VERSION" ]]; then
            echo "Error: version bump failed"
            exit 1
          fi

      - name: Commit and tag
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          echo "Creating release $TAG"
          gh release create "$TAG" \
            --target main \
            --title "Needlecast $VERSION" \
            --generate-notes

      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          echo "Triggering release.yml for v$VERSION"
          gh workflow run release.yml \
            --ref main \
            -f version="$VERSION"
